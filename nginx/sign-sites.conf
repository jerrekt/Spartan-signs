# Symlinked into /etc/nginx/sites-enabled/ on the spartan-signs LXC (Kratos, CT 310, 10.0.0.71)
# spartan-signs.adsuaracloud.com      -> control site   (signs/)
# spartan-signs.adsuaracloud.com/lab  -> build options  (lab/)
# spartan-signs.adsuaracloud.com/about -> about page    (about/)
server {
    listen 80;
    server_name spartan-signs.adsuaracloud.com;
    root /var/www/spartan-signs/signs;
    index index.html;

    # Cloudflare talks to nginx over plain HTTP; keep redirects relative so visitors stay on https
    absolute_redirect off;

    location = /lab { return 301 /lab/; }
    location /lab/ { alias /var/www/spartan-signs/lab/; }

    location = /about { return 301 /about/; }
    location /about/ { alias /var/www/spartan-signs/about/; }

    # never serve .git or other dotfiles
    location ~ /\. { deny all; }
}
